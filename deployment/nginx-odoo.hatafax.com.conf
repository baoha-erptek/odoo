# nginx site config — odoo.hatafax.com → Odoo 19 (port 8169) on 129.150.63.207
#
# Path on staging server: /etc/nginx/sites-available/odoo.hatafax.com
# Enable: ln -s /etc/nginx/sites-available/odoo.hatafax.com /etc/nginx/sites-enabled/
# Test:   nginx -t
# Reload: systemctl reload nginx
#
# Prereqs:
# - DNS: odoo.hatafax.com A 129.150.63.207
# - certbot --nginx -d odoo.hatafax.com  (Let's Encrypt; certbot rewrites this
#   file in-place to add ssl_certificate lines + 80→443 redirect block)

upstream odoo_backend {
    server 127.0.0.1:8169;
}

upstream odoo_websocket {
    server 127.0.0.1:8172;
}

server {
    listen 80;
    listen [::]:80;
    server_name odoo.hatafax.com;

    # certbot will rewrite this block to redirect → 443.
    client_max_body_size 50M;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    location /websocket {
        proxy_pass http://odoo_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Gearment webhook (P0-18b2). HMAC verification handled by Odoo controller.
    location /gearment/webhook {
        proxy_pass http://odoo_backend;
        proxy_set_header Host $host;
        client_max_body_size 256k;
    }

    location / {
        proxy_redirect off;
        proxy_pass http://odoo_backend;
    }

    # Optional: gzip text content.
    gzip on;
    gzip_min_length 1000;
    gzip_types text/css text/plain text/javascript application/json
               application/javascript application/xml;

    # Security headers (HSTS added by certbot post-SSL).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
